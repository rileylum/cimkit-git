[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cimkit-git"
version = "0.3.0"
description = "Version control for ArcGIS project files (.aprx), part of the cimkit suite"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Riley Lum", email = "rileywlum@gmail.com" }]
keywords = ["arcgis", "aprx", "cim", "cimkit", "gis", "git", "version-control"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/rileylum/cimkit-git"
Repository = "https://github.com/rileylum/cimkit-git"
Issues = "https://github.com/rileylum/cimkit-git/issues"

[project.scripts]
git-cim = "cimkit_git.__main__:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["cimkit_git*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
